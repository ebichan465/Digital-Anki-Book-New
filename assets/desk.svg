    <path d="M-20 770C140 748 280 792 438 776C594 760 704 736 860 756C1016 776 1148 804 1300 780C1450 756 1528 756 1620 772" stroke="#69482c" stroke-opacity=".10" stroke-width="5"/>
    <path d="M-25 854C150 832 278 876 450 860C620 844 732 820 888 842C1048 864 1172 890 1330 868C1478 846 1544 846 1635 856" stroke="#7a5635" stroke-opacity=".09" stroke-width="4"/>
  </g>

  <!-- More visible grain lines to give the desk a hand-finished look -->
  <g opacity=".20" filter="url(#grainBlur)">
    <path d="M0 58C170 44 314 72 470 60C632 48 778 30 944 52C1120 76 1280 70 1600 42" stroke="#8b6540" stroke-width="2.3"/>
    <path d="M0 176C166 154 312 196 468 180C628 164 780 140 950 164C1126 192 1282 186 1600 162" stroke="#8b6540" stroke-width="2.1"/>
    <path d="M0 296C168 276 312 320 470 304C630 290 784 262 950 286C1122 312 1284 308 1600 284" stroke="#8b6540" stroke-width="2.2"/>
    <path d="M0 456C170 434 316 476 474 460C636 444 782 418 952 442C1128 468 1288 462 1600 438" stroke="#8b6540" stroke-width="2.2"/>
    <path d="M0 626C168 606 314 648 472 632C634 616 786 590 954 614C1128 640 1288 636 1600 612" stroke="#8b6540" stroke-width="2.1"/>
    <path d="M0 808C172 788 320 830 480 816C644 802 790 776 964 798C1138 822 1294 818 1600 794" stroke="#8b6540" stroke-width="2.2"/>
  </g>

  <!-- Knots -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".78">
    <g transform="translate(260 226)">
      <ellipse cx="0" cy="0" rx="48" ry="26" stroke="#7d5432" stroke-opacity=".28" stroke-width="4"/>
      <ellipse cx="0" cy="0" rx="30" ry="16" stroke="#6a462a" stroke-opacity=".26" stroke-width="4"/>
      <ellipse cx="0" cy="0" rx="15" ry="8" stroke="#4d311d" stroke-opacity=".28" stroke-width="4"/>
      <path d="M-56 2C-28 -8 -10 -10 0 -2C12 8 28 8 56 -2" stroke="#9b7246" stroke-opacity=".18" stroke-width="3"/>
    </g>

    <g transform="translate(1216 482) rotate(-8)">
      <ellipse cx="0" cy="0" rx="56" ry="30" stroke="#7d5432" stroke-opacity=".26" stroke-width="4"/>
      <ellipse cx="0" cy="0" rx="34" ry="18" stroke="#6a462a" stroke-opacity=".24" stroke-width="4"/>
      <ellipse cx="0" cy="0" rx="16" ry="9" stroke="#4d311d" stroke-opacity=".26" stroke-width="4"/>
      <path d="M-64 3C-38 -10 -14 -10 0 -2C15 8 34 10 64 -1" stroke="#9b7246" stroke-opacity=".16" stroke-width="3"/>
    </g>

    <g transform="translate(860 690) rotate(12)">
      <ellipse cx="0" cy="0" rx="38" ry="20" stroke="#7d5432" stroke-opacity=".22" stroke-width="4"/>
      <ellipse cx="0" cy="0" rx="22" ry="11" stroke="#6a462a" stroke-opacity=".20" stroke-width="4"/>
      <ellipse cx="0" cy="0" rx="10" ry="5" stroke="#4d311d" stroke-opacity=".20" stroke-width="4"/>
    </g>
  </g>

  <!-- Gentle center highlight -->
  <rect width="1600" height="900" fill="url(#toneSoft)"/>

  <!-- Slight edge darkening for depth -->
  <rect width="1600" height="900" fill="url(#cornerShade)" opacity=".85"/>
</svg>