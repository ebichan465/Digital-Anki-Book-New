    <path d="M-20 204C140 186 250 228 392 212C536 196 628 172 772 194C920 218 1050 236 1202 210C1340 186 1468 188 1620 206" stroke="#805735" stroke-opacity=".10" stroke-width="4"/>
    <path d="M-35 270C112 252 260 292 412 276C558 262 668 238 812 256C960 274 1082 298 1240 274C1388 252 1492 250 1635 270" stroke="#6f4f31" stroke-opacity=".10" stroke-width="5"/>
    <path d="M-30 344C120 326 250 364 400 350C548 336 652 310 792 330C938 350 1064 370 1216 346C1364 322 1478 322 1630 342" stroke="#7a5635" stroke-opacity=".10" stroke-width="4"/>
    <path d="M-25 420C128 396 250 446 404 426C556 408 660 384 810 406C960 428 1088 454 1238 428C1388 402 1496 402 1628 420" stroke="#67482d" stroke-opacity=".10" stroke-width="5"/>
    <path d="M-30 500C130 480 262 524 412 506C560 488 668 462 820 484C972 506 1092 534 1246 508C1400 482 1500 482 1632 502" stroke="#7c5837" stroke-opacity=".10" stroke-width="4"/>
    <path d="M-40 586C126 564 250 612 402 594C554 576 660 552 814 574C970 596 1100 624 1256 598C1408 574 1508 574 1640 592" stroke="#6c4b2f" stroke-opacity=".11" stroke-width="5"/>
