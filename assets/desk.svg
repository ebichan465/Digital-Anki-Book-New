<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" preserveAspectRatio="none">
  <defs>
    <linearGradient id="woodBase" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ccb084"/>
      <stop offset=".28" stop-color="#c2a06f"/>
      <stop offset=".58" stop-color="#b9915e"/>
      <stop offset="1" stop-color="#ae8250"/>
    </linearGradient>

    <linearGradient id="toneSoft" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8d6841" stop-opacity=".10"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset=".50" stop-color="#ffffff" stop-opacity=".00"/>
      <stop offset=".82" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#8d6841" stop-opacity=".12"/>
    </linearGradient>

    <radialGradient id="cornerShade" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".72" stop-color="#000000" stop-opacity=".03"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".14"/>
    </radialGradient>

    <filter id="grainBlur" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>

    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- Base wood -->
  <rect width="1600" height="900" fill="url(#woodBase)"/>

  <!-- Subtle color variation bands -->
  <path d="M0 110C220 86 380 130 560 112C740 94 920 72 1100 98C1260 120 1410 90 1600 116V220H0Z" fill="#9f7348" fill-opacity=".08"/>
  <path d="M0 330C210 292 396 356 570 330C760 302 926 280 1110 312C1280 342 1432 308 1600 330V440H0Z" fill="#7f5a37" fill-opacity=".07"/>
  <path d="M0 560C190 538 360 590 560 566C750 542 960 508 1135 540C1310 570 1460 548 1600 560V670H0Z" fill="#ffffff" fill-opacity=".03"/>
  <path d="M0 760C220 724 392 798 588 770C792 742 972 720 1160 752C1330 780 1468 764 1600 770V900H0Z" fill="#7b5737" fill-opacity=".06"/>

