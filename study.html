<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#fbf7ed" />
  <title>Digital Anki Book - 暗記する</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/study.css">
</head>
<body class="study-page">
  <div class="study-scene">
    <header class="study-topbar" aria-label="暗記するトップバー">
      <button id="btnBackHome" class="study-topbar-btn study-topbar-btn--back" type="button" aria-label="トップページへ戻る">
        <img
          src="assets/back.svg"
          alt="戻る"
          class="study-topbar-btn__icon">
      </button>

      <div class="study-topbar__title">
        <h1>暗記する</h1>
      </div>

      <div class="study-topbar__spacer" aria-hidden="true"></div>
    </header>

    <main class="study-main">
      <section class="study-toolbar" aria-label="Book一覧の操作">
        <button id="btnDisplayMenu" class="study-toolbar-btn" type="button">
          <span class="study-toolbar-btn__label">表示</span>
          <span id="displayCurrentLabel" class="study-toolbar-btn__value">すべて表示</span>
        </button>

        <button id="btnSortMenu" class="study-toolbar-btn" type="button">
          <span class="study-toolbar-btn__label">並び替え</span>
          <span id="sortCurrentLabel" class="study-toolbar-btn__value">新しい順</span>
        </button>

        <button id="btnSelectDelete" class="study-toolbar-btn" type="button">
          <span class="study-toolbar-btn__label">選択して削除</span>
        </button>
      </section>

      <button id="btnTodayReview" class="study-review-btn" type="button">
        今日の復習
      </button>

      <section id="deleteModePanel" class="study-delete-panel hidden" aria-label="選択して削除の操作">
        <div class="study-delete-panel__info">
          <span id="deleteModeCount">0</span>冊選択中
        </div>
        <div class="study-delete-panel__actions">
          <button id="btnCancelDeleteMode" class="study-delete-panel__button" type="button">キャンセル</button>
          <button id="btnConfirmDeleteMode" class="study-delete-panel__button" type="button">削除する</button>
        </div>
      </section>

      <section id="booksList" class="study-books" aria-label="Book一覧"></section>
      <p id="emptyState" class="study-empty">新しくBookを作りましょう。</p>
    </main>
  </div>

  <div id="sheetBackdrop" class="study-sheet-backdrop hidden" aria-hidden="true">
    <div class="study-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="study-sheet__handle" aria-hidden="true"></div>
      <div class="study-sheet__head">
        <h2 id="sheetTitle" class="study-sheet__title">表示</h2>
        <p id="sheetDescription" class="study-sheet__description">選択してください。</p>
      </div>
      <div id="sheetOptions" class="study-sheet__options"></div>
      <div class="study-sheet__footer">
        <button id="sheetCancel" class="study-sheet__button study-sheet__button--cancel" type="button">キャンセル</button>
      </div>
    </div>
  </div>

 <script src="storage.js"></script>
 <script src="study.js"></script>
</body>
</html>
