<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f8f1e6" />
  <title>Digital Anki Book</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="home-page">
  <main class="home-scene">
    <section class="home-sheet" aria-label="Digital Anki Book">
      <div class="home-title">
        <h1>Digital Anki Book</h1>
        <p class="home-subtitle">未来の文房具セット。</p>
      </div>

      <div class="home-actions">
        <a href="edit.html" class="home-action-btn home-action-btn--blue">
          <span class="home-action-label">マスクをつくる</span>
        </a>

        <div class="home-study-wrap">
          <a href="study.html" class="home-action-btn home-action-btn--red" id="homeStudyLink">
            <span class="home-action-label">暗記する</span>
          </a>
          <div id="homeReviewBubble" class="review-bubble hidden" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
  (() => {
    const STORAGE_KEY = 'digital-anki-projects-v1';
    const DAY = 24 * 60 * 60 * 1000;
    const INTERVALS = [1, 7, 30, 90];
    const bubble = document.getElementById('homeReviewBubble');

    function loadAllProjects() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      try {
        return JSON.parse(raw).projects || [];
      } catch (e) {
        return [];
      }
    }

    function normalizeReview(project) {
      const createdAt = Number(project && project.createdAt) || Date.now();
      const r = project && project.review && typeof project.review === 'object' ? project.review : null;
      const stage = Number.isFinite(Number(r && r.stage)) ? Number(r.stage) : 0;
      const completed = !!(r && r.completed);
      const nextReviewAt = Number.isFinite(Number(r && r.nextReviewAt))
        ? Number(r.nextReviewAt)
        : createdAt + (INTERVALS[Math.min(stage, INTERVALS.length - 1)] * DAY);
      return { stage, nextReviewAt, completed };
    }

    const now = Date.now();
    const dueCount = loadAllProjects().filter((project) => {
      const review = normalizeReview(project);
      return !review.completed && Number.isFinite(review.nextReviewAt) && review.nextReviewAt <= now;
    }).length;

    if (bubble && dueCount > 0) {
      bubble.textContent = `今日の復習 ${dueCount}枚`;
      bubble.classList.remove('hidden');
    }
  })();
  </script>
</body>
</html>
