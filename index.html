<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Digital Anki Book</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>Digital Anki Book</h1>
</header>

<main class="container" style="align-items:center; justify-content:center; min-height:60vh;">
  <div style="text-align:center; width:120%; max-width:900px; margin:0 auto;">
    <h2 style="margin-bottom:24px;">Digital Anki Bookとは?</h2>
    <p style="max-width:900px; margin:0 auto 30px;">
      Digital Anki Bookは、赤シートで隠して勉強する感覚をそのままデジタルで再現した学習サイトです。
      覚えたい画像の上に自分でマスクを配置し、クリック操作で答えを確認することで演習形式の暗記学習ができます。
    </p>

    <div style="display:flex; gap:24px; justify-content:center; margin-top:28px;">
      <a href="edit.html" class="home-action-btn">マスクをつくる</a>
      <a href="study.html" class="home-action-btn">暗記する</a>
    </div>
    <section class="how-to-use">
  <h2>使い方</h2>
  <ol>
    <li>「マスクをつくる」を押して、画像・テキストにマスクを挿入し、保存しよう</li>
    <li>「暗記モード」を押して、保存した画像・テキストを使って学習しよう</li>
  </ol>
</section>
  </div>
</main>
</body>
</html>
